# SDP (Spherical Diffusion Policy) Configuration for Real ALOHA
# Based on sdp_per_skill.yaml but adapted for real ALOHA data format

defaults:
  - base

use_wandb: true
wandb_note: "SDP training on real ALOHA data"

training:
  eval_interval: 50
  num_epochs: 2000

env:
  env_class: 'sdp_real_aloha'
  # num_eef: 1
  dof: 7
  max_episode_length: 50

agent:
  agent_name: sdp

model:
  obs_mode: 'pc'
  ac_mode: 'traj'
  use_torch_compile: true
  
  # Horizons — pred_horizon=1 since only the first step is used at runtime.
  # Requires down_dims to be a single element (no temporal halving stages) — see below.
  obs_horizon: 1
  pred_horizon: 1
  ac_horizon: 1

  # Policy parameters (following reference sdp_ddpm_5layer.yaml)
  canonicalize: false               # Canonicalize point cloud and actions
  obs_as_global_cond: true         # Use observations as global conditioning
  condition_type: "film"           # Conditioning type: "film" or "cross_attention"
  denoise_nn: "irrep"              # Denoising network type: "irrep", "reg", or "nn"
  norm: false                      # Use normalization in encoder/diffusion
  rot_aug: [5, 5, 180]            # Rotation augmentation (degrees): [x, y, z]
  rad_aug: 0                       # Radial augmentation (translation noise)
  pcd_noise: 0                     # Point cloud noise augmentation
  n_groups: 8                      # Number of groups for convolution

  # Encoder config — 3-layer EquiformerV2 with lmax=1 (reduced from 5-layer lmax=2)
  # lmax: 2→1 cuts irrep coefficients per channel from 9→4 (~2x win in spherical ops)
  # 5 layers → 3 layers removes the two most expensive (widest channel) stages
  # Requires retraining from scratch.
  encoder:
    encoder_output_dim: 64         # Output channel dimension (alias: c_dim)
    c_dim: 64                      # Must match language_encoder_cfg.hidden_size
    lmax: 1                        # Max degree of spherical harmonics (1 = up to l=1)
    mmax: 1                        # Max order (same as lmax)
    max_neighbors: [16, 16, 128]   # KNN neighbors at each scale (3 layers)
    max_radius: [3, 3, 3]          # Graph radius at each scale
    pool_ratio: [0.5, 0.5]         # FPS pooling ratio (n_layers-1 = 2 ratios)
    sphere_channels: [16, 32, 64]  # Channels at each scale (3 layers)
    attn_hidden_channels: [16, 32, 64]
    attn_alpha_channels: [4, 8, 16]
    attn_value_channels: [2, 4, 8]
    ffn_hidden_channels: [32, 64, 128]
    edge_channels: [8, 16, 32]
    num_distance_basis: [64, 64, 64]  # Reduced from 128
    num_heads: 4
    v_grid_resolution:
    d_grid_resolution:
    grid_resolution: 8             # Reduced from 12 (cuts S2 grid FFT cost)
    pool_method: "fpsknn"
    deterministic: false
    alpha_drop: 0.1
    drop_path_rate: 0.0
    proj_drop: 0.1

  # Diffusion config (SDTU)
  # down_dims must be a single element when pred_horizon=1:
  # with N elements, N-1 stages halve the time axis, requiring pred_horizon >= 2^(N-1).
  # Single element → 0 halving stages → any pred_horizon including 1.
  diffusion:
    diffusion_step_embed_dim: 64   # Reduced to match smaller c_dim
    down_dims: [64]                # Single element: no temporal downsampling
    kernel_size: 5
    FiLM_type: 'SFiLM'

  # Language encoder (for skill/task text conditioning)
  language_encoder_cfg:
    network_name: MLPEncoder
    input_size: 768               # BERT embedding size
    hidden_size: 64               # Must match encoder c_dim
    num_layers: 1
  
  # Inference steps: DDIM re-spaces num_train_timesteps=100 into this many steps.
  # No retraining needed — DDIM reuses DDPM epsilon-prediction weights.
  num_diffusion_iters: 15

  # Noise scheduler (DDIM for fast inference; trained with DDPM but weights are compatible)
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    prediction_type: epsilon

data:
  dataset:
    path: null  # Set via command line, e.g., data/handoff_cup
    task_name: null  # Set via command line, e.g., handoff_cup (optional if use_task_name=false)
    num_points: 128               # Number of points in point cloud
    num_workers: 4
    
    # uniskills: ['grasp', 'place']  # Skills to extract from data
    uniskills: ['grasp']
    dataset_type: 'real_aloha_traj'  # Use real ALOHA dataset
    
    # uniskills: ['bimanual']
    # dataset_type: 'real_aloha_biop_jpose'
    
    is_obj_centric: true
    is_add_bottom: true
    downsample_method: 'fps'
    rot_aug: true
    shuffle_pc: true
    aug_traj_nums: 16                  # Number of trajectory samples per episode
    
    embedding_cache_dir: "./data/bert"
    
    # Action representation
    # 3vec: position + 2 rotation vectors (equivariant)
    # 4pts: 4 keypoints on gripper
    eef_representation: "3vec"
    
    normalization_method: "all"
    
    original_gripper_pcd: [[0.10, 0.01, 0], 
                            [0.03, -0.04, 0],
                            [0.02, 0.05, 0],
                            [0, 0, 0]]

    use_pc_color: true               # Use RGB color in point cloud 

# Shape metadata (for reference)
shape_meta: &shape_meta
  obs:
    point_cloud:
      shape: [128, 6]  # xyz + rgb if use_pc_color is true
      type: point_cloud
  action: 
    shape: [13]  # 3 pos + 6 rot (2x3 vectors) + 1 gripper + 3 pos

eval:
  history_bid: 10

