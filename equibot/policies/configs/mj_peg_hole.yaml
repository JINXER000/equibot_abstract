defaults:
  - base

use_wandb: true

training:
  # ckpt: "/home/xuhang/Desktop/yzchen_ws/equibot_abstract/logs/train/mj_peg_hole/ckpt00800.pth"
  eval_interval: 1
  num_epochs: 1000

env:
  env_class: 'mj_peg_hole'
  num_eef: 1
  dof: 7
  max_episode_length: 50

agent:
  # agent_name: aloha
  agent_name: compaloha

model:
  # noise_scheduler:
  #   num_train_timesteps: 1000

## use vec_pointnet and train from scratch
  hidden_dim: 32
  encoder:
    backbone_type: vn_pointnet
    backbone_args: 
      num_layers: 4
      preload_path: 'None' 


# ### use VDGCNN and transfer from pretrained model
#   hidden_dim: 256
#   encoder:
#     backbone_type: VDGCNN
#     backbone_args: 
#       num_layers: 7
#       preload_path: "/home/chenyizhou/imitation_learning/equibot_abstract/pretrained/mugs.pt"


data:
  dataset:
    num_points: 256
    # symb_mask: ['qpose_left', 'qpose_right', None, None, None]
    symb_mask: ['None', 'None', 'grasp_left', 'grasp_right', None]
    # symb_mask: [None, 'qpose_right', None, 'grasp_right', None]
    # symb_mask: [None, None, None, 'grasp_right', None]
    tamp_type: 'precondition'
    # dataset_type: 'mj_socket_test'
    dataset_type: 'mj_insertion_pred'
    has_eff: false
    is_obj_centric: True


eval:
  history_bid: 10



