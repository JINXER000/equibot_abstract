defaults:
  - base

use_wandb: true

training:
  # ckpt: "/home/chenyizhou/imitation_learning/equibot_abstract/logs/train/aloha_transfer_tape/ckpt00100.pth"
  eval_interval: 1

env:
  env_class: 'tape'
  dof: 6
  max_episode_length: 50

agent:
  agent_name: aloha

model:

# ## use vec_pointnet and train from scratch
#   hidden_dim: 32
#   encoder:
#     backbone_type: vn_pointnet
#     backbone_args: 
#       num_layers: 4
#       preload_path: 'None'


### use VDGCNN and transfer from pretrained model
  hidden_dim: 256
  encoder:
    backbone_type: VDGCNN
    backbone_args: 
      num_layers: 7
      preload_path: "/home/chenyizhou/imitation_learning/equibot_abstract/pretrained/mugs.pt"
data:
  dataset:
    num_points: 512
    # symb_mask: ['qpose_left', 'qpose_right', None, 'grasp_right', None]
    symb_mask: [None, None, None, 'grasp_right', None]
    tamp_type: 'precondition'
    dataset_type: 'hdf5'

eval:
  history_bid: 10



